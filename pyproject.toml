[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "automated-elt-data-pipeline"
version = "1.0.0"
description = "Modern Columnar Data Pipeline with Medallion Architecture, SQL Transformations, and Automated Data Quality Auditing"
readme = "README.md"
authors = [
  { name = "Samay Sawal", email = "cricketworldsamay@gmail.com" }
]
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.6.0",
    "python-dotenv>=1.0.1"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0"
]

